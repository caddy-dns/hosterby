name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  xcaddy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7
      - run: xcaddy build --with github.com/caddy-dns/hosterby=.
      - run: ./caddy list-modules | grep -x dns.providers.hosterby
